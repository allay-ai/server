name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.4.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false
      moonlands:
        description: "Ship the release to Moonlands (needs the FAMILY_ACTIONS_TOKEN secret)"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release

env:
  IMAGE: ghcr.io/allay-ai/server

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      NOTES: release-notes.md
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 2.4.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Write the release notes
        shell: python
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          notes += f"\n\n```bash\ndocker pull {os.environ['IMAGE']}:{version}\n```"
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes + "\n")
          print(notes)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          build-args: APP_VERSION=${{ inputs.version }}
          cache-from: type=gha
      - name: Publish the GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Allay Server $VERSION" --notes-file "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    if: inputs.moonlands
    runs-on: ubuntu-latest
    steps:
      - name: Ship to Moonlands
        # Moonlands' “Ship a release” workflow builds the new backend on the server.
        run: gh workflow run ship-plugin.yml -R MairwunNx/minecraft -f repo="$GITHUB_REPOSITORY" -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.FAMILY_ACTIONS_TOKEN }}
          VERSION: ${{ inputs.version }}
