---
networks:
  default:
services:
  allay-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allay-server
    cpus: '1.0'
    depends_on:
      allay-server-mongo:
        condition: service_healthy
    env_file: .env
    environment:
      API_NAME: ${API_NAME}
      API_URL: ${API_URL}
      CHAT_TTL_SECONDS: ${CHAT_TTL_SECONDS}
      MAX_MESSAGES: ${MAX_MESSAGES}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_URI: ${MONGODB_URI}
      OPENROUTER_API_CTX: ${OPENROUTER_API_CTX}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_MODEL: ${OPENROUTER_API_MODEL}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      SEARCH_MODEL: ${SEARCH_MODEL:-perplexity/sonar}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      TRACE_SAMPLE: ${TRACE_SAMPLE:-}
      TRACE_DAYS: ${TRACE_DAYS:-}
      SELFHOSTED: ${SELFHOSTED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      TOOL_TIMEOUT_MS: ${TOOL_TIMEOUT_MS:-15000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-}
      PORT: ${PORT}
      # Self-hosted: the token every plugin sends as server.token; at least 24 characters (openssl rand -hex 24).
      PLUGIN_TOKEN: ${PLUGIN_TOKEN:-}
      # The reverse proxy in front, if any: only its X-Forwarded-For counts.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TZ: ${TZ}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test: ["CMD", "/bin/sh", "-c", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 300m
    networks: [ default ]
    # Only this machine reaches the backend; a reverse proxy with TLS publishes it, or change the address on purpose.
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    restart: unless-stopped
    # The key that seals secrets saved in the admin panel.
    volumes:
      - allay-server-data:/data
  allay-server-mongo:
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    container_name: allay-server-mongo
    cpus: '0.5'
    env_file: .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      # With a root user MongoDB wants a password from everyone; the backend's MONGODB_URI carries it (?authSource=admin).
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      TZ: ${TZ}
    healthcheck:
      interval: 15s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' | grep -q 1"]
      timeout: 5s
    image: mongo:8.0.34
    logging:
      driver: local
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 256m
    networks: [ default ]
    # No ports: only the backend reaches MongoDB, inside this network.
    restart: unless-stopped
    volumes:
      - allay-server-mongo-data:/data/db
volumes:
  allay-server-data:
    driver: local
  allay-server-mongo-data:
    driver: local
