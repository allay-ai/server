---
networks:
  default:
services:
  allay-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allay-server
    cpus: '1.0'
    depends_on:
      allay-server-mongo:
        condition: service_healthy
      allay-server-redis:
        condition: service_healthy
    env_file: .env
    environment:
      API_NAME: ${API_NAME}
      API_URL: ${API_URL}
      CHAT_TTL_SECONDS: ${CHAT_TTL_SECONDS}
      MAX_MESSAGES: ${MAX_MESSAGES}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_URI: ${MONGODB_URI}
      OPENROUTER_API_CTX: ${OPENROUTER_API_CTX}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_MODEL: ${OPENROUTER_API_MODEL}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      SEARCH_MODEL: ${SEARCH_MODEL:-perplexity/sonar}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      TRACE_SAMPLE: ${TRACE_SAMPLE:-}
      TRACE_DAYS: ${TRACE_DAYS:-7}
      SELFHOSTED: ${SELFHOSTED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      TOOL_TIMEOUT_MS: ${TOOL_TIMEOUT_MS:-15000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-8}
      PORT: ${PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test: ["CMD", "/bin/sh", "-c", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 300m
    networks: [ default ]
    ports:
      - ${PORT}:3000
    restart: unless-stopped
    # The key that seals secrets saved in the admin panel.
    volumes:
      - allay-server-data:/data
  allay-server-mongo:
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    container_name: allay-server-mongo
    cpus: '0.5'
    env_file: .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      TZ: ${TZ}
    healthcheck:
      interval: 15s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\")' --quiet | grep -q 1"]
      timeout: 5s
    image: mongo:8.0.34
    logging:
      driver: local
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 256m
    networks: [ default ]
    ports: [ "27017:27017" ]
    restart: unless-stopped
    volumes:
      - allay-server-mongo-data:/data/db
  allay-server-redis:
    command: >
      redis-server --port 6379
      --loglevel warning
      --save 20 1
      --requirepass ${REDIS_PASSWORD}
    container_name: allay-server-redis
    cpus: '0.5'
    env_file: [ .env ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping"]
      timeout: 5s
    image: redis:8.10-alpine
    logging:
      driver: local
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 256m
    mem_reservation: 128m
    networks: [ default ]
    ports: [ "6379:6379" ]
    restart: unless-stopped
    user: '0'
    volumes:
      - allay-server-redis-data:/data
volumes:
  allay-server-data:
    driver: local
  allay-server-mongo-data:
    driver: local
  allay-server-redis-data:
    driver: local