---
networks:
  default:
    driver: bridge
services:
  allay-server:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add: [ "SYS_PTRACE" ]
    container_name: allay-server-dev
    cpus: '1.0'
    depends_on:
      allay-server-mongo:
        condition: service_healthy
    env_file: .env.dev
    environment:
      API_NAME: ${API_NAME}
      API_URL: ${API_URL}
      CHAT_TTL_SECONDS: ${CHAT_TTL_SECONDS}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_URI: ${MONGODB_URI}
      OPENROUTER_API_CTX: ${OPENROUTER_API_CTX}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_MODEL: ${OPENROUTER_API_MODEL}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      SEARCH_MODEL: ${SEARCH_MODEL:-perplexity/sonar}
      SELFHOSTED: ${SELFHOSTED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      TOOL_TIMEOUT_MS: ${TOOL_TIMEOUT_MS:-15000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-}
      PORT: ${PORT}
      PLUGIN_TOKEN: ${PLUGIN_TOKEN:-}
      TZ: ${TZ}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test: ["CMD", "/bin/sh", "-c", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 300m
    networks: [ default ]
    ports:
      - 127.0.0.1:${PORT}:3000
    restart: unless-stopped
    security_opt: [ "seccomp:unconfined" ]
    # The key that seals secrets saved in the admin panel.
    volumes:
      - allay-server-data-dev:/data
  allay-server-mongo:
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    container_name: allay-server-mongo-dev
    cpus: '0.5'
    env_file: .env.dev
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      TZ: ${TZ}
    healthcheck:
      interval: 15s
      retries: 12
      start_period: 20s
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\")' --quiet | grep -q 1"]
      timeout: 5s
    image: mongo:8.0.34
    logging:
      driver: local
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 512m
    mem_reservation: 256m
    networks: [ default ]
    # Local development only: published on this machine's loopback, never on every interface.
    ports: [ "127.0.0.1:27017:27017" ]
    restart: unless-stopped
    volumes:
      - allay-server-mongo-data-dev:/data/db
volumes:
  allay-server-data-dev:
    driver: local
  allay-server-mongo-data-dev:
    driver: local
